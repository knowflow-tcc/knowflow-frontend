<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuários | KnowFlow</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <script src="/js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="carregando">
<div class="app">
    <aside class="sidebar" id="kf-sidebar"></aside>
    <div class="app-main">
        <header class="topbar" id="kf-topbar"></header>

        <!-- RF02 cadastro, edição e desativação de usuários; RF12 perfis; RNF02 (LGPD) anonimização -->
        <main class="conteudo">
            <div class="cabecalho-pagina">
                <div>
                    <h2>Usuários</h2>
                    <p class="subtitulo">Cadastre os colaboradores, escolha o perfil e o departamento de cada um.</p>
                </div>
                <button type="button" class="botao botao-primario" id="novo"><i class="bi bi-person-plus"></i> Novo usuário</button>
            </div>

            <section class="painel">
                <div class="painel-cabecalho">
                    <input class="form-control filtro-tabela" type="search" id="filtro" placeholder="Filtrar por nome, e-mail ou departamento" aria-label="Filtrar usuários">
                    <span class="contador" id="total">0</span>
                </div>
                <div class="tabela-rolavel">
                    <table class="tabela">
                        <thead><tr><th>Nome</th><th>Perfil</th><th>Departamento</th><th>Situação</th><th class="acoes">Ações</th></tr></thead>
                        <tbody id="linhas"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>

<!-- Formulário de usuário (janela) -->
<div class="modal fade" id="janela" tabindex="-1" aria-labelledby="titulo-janela" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content painel" id="form-usuario" novalidate>
            <div class="modal-header">
                <h5 class="modal-title" id="titulo-janela">Novo usuário</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div data-erro-geral></div>
                <div class="mb-3">
                    <label class="form-label" for="nome">Nome *</label>
                    <input class="form-control" id="nome" name="nome" maxlength="120" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">E-mail *</label>
                    <input class="form-control" id="email" name="email" type="email" maxlength="150" required placeholder="nome@empresa.com">
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-12 col-sm-6">
                        <label class="form-label" for="perfil">Perfil *</label>
                        <select class="form-select" id="perfil" name="perfil" required>
                            <option value="COLABORADOR">Colaborador</option>
                            <option value="GESTOR">Gestor</option>
                            <option value="ADMINISTRADOR">Administrador</option>
                        </select>
                    </div>
                    <div class="col-12 col-sm-6">
                        <label class="form-label" for="departamentoId">Departamento *</label>
                        <select class="form-select" id="departamentoId" name="departamentoId" required></select>
                    </div>
                </div>
                <div>
                    <label class="form-label" for="senha">Senha <span id="senha-obrigatoria">*</span></label>
                    <input class="form-control" id="senha" name="senha" type="password" autocomplete="new-password" maxlength="72">
                    <div class="form-text" id="dica-senha">Mínimo de 8 caracteres, com letras e números.</div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="botao botao-contorno" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="botao botao-primario"><i class="bi bi-check-lg"></i> Salvar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/usuarios.js"></script>
</body>
</html>
