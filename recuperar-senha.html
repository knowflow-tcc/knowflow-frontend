<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar senha | KnowFlow</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <script src="/js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<!-- RF14 - recuperação de senha por e-mail.
     Sem "token" na URL: pede o e-mail. Com "token" (link do e-mail): define a nova senha. -->
<main class="auth">
    <div class="auth-caixa">
        <div class="auth-marca">
            <i class="bi bi-diagram-3-fill"></i>
            <span>Know<span class="marca-sufixo">Flow</span></span>
        </div>

        <div class="painel">
            <div class="painel-corpo p-4">
                <div id="aviso"></div>

                <form id="form-pedido" novalidate hidden>
                    <h2 class="h5 fw-bold mb-1">Recuperar senha</h2>
                    <p class="subtitulo mb-4">Informe o e-mail cadastrado. Enviaremos um link para você criar uma nova senha.</p>
                    <div data-erro-geral></div>
                    <div class="mb-4">
                        <label class="form-label" for="email">E-mail</label>
                        <input class="form-control" id="email" name="email" type="email" autocomplete="username"
                               placeholder="nome@empresa.com" required autofocus>
                    </div>
                    <button type="submit" class="botao botao-primario botao-bloco">
                        <i class="bi bi-envelope"></i> Enviar link
                    </button>
                </form>

                <form id="form-nova-senha" novalidate hidden>
                    <h2 class="h5 fw-bold mb-1">Criar nova senha</h2>
                    <p class="subtitulo mb-4">Use pelo menos 8 caracteres, com letras e números.</p>
                    <div data-erro-geral></div>
                    <div class="mb-3">
                        <label class="form-label" for="senha">Nova senha</label>
                        <input class="form-control" id="senha" name="senha" type="password" autocomplete="new-password" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="confirmacao">Repita a nova senha</label>
                        <input class="form-control" id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="botao botao-primario botao-bloco">
                        <i class="bi bi-key"></i> Salvar nova senha
                    </button>
                </form>
            </div>
        </div>
        <p class="text-center subtitulo mt-3"><a href="/login.html"><i class="bi bi-arrow-left"></i> Voltar para o login</a></p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/recuperar-senha.js"></script>
</body>
</html>
