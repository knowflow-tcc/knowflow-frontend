<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categorias | KnowFlow</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <script src="/js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="carregando">
<div class="app">
    <aside class="sidebar" id="kf-sidebar"></aside>
    <div class="app-main">
        <header class="topbar" id="kf-topbar"></header>

        <!-- RF07 - categorias em árvore (caso de uso "Gerenciar categorias" - Gestor) -->
        <main class="conteudo">
            <div class="cabecalho-pagina">
                <div>
                    <h2>Categorias</h2>
                    <p class="subtitulo">Organize os problemas em categorias e subcategorias. Ao buscar por uma categoria, as subcategorias entram junto.</p>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-12 col-lg-7">
                    <section class="painel" aria-labelledby="titulo-arvore">
                        <div class="painel-cabecalho">
                            <h3 id="titulo-arvore"><i class="bi bi-diagram-3"></i> Árvore de categorias</h3>
                            <span class="contador" id="total">0</span>
                        </div>
                        <div class="painel-corpo" id="arvore"></div>
                    </section>
                </div>

                <div class="col-12 col-lg-5">
                    <form class="painel painel-fixo" id="form-categoria" novalidate>
                        <div class="painel-cabecalho"><h3 id="titulo-form"><i class="bi bi-plus-circle"></i> Nova categoria</h3></div>
                        <div class="painel-corpo">
                            <div data-erro-geral></div>
                            <div class="mb-3">
                                <label class="form-label" for="nome">Nome *</label>
                                <input class="form-control" id="nome" name="nome" maxlength="80" required placeholder="Ex.: Redes e Internet">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="idPai">Fica dentro de <span class="opcional">(categoria superior)</span></label>
                                <select class="form-select" id="idPai" name="idPai"></select>
                                <div class="form-text">Deixe "Nenhuma" para criar uma categoria principal.</div>
                            </div>
                            <div class="formulario-acoes">
                                <button type="submit" class="botao botao-primario"><i class="bi bi-check-lg"></i> Salvar</button>
                                <button type="button" class="botao botao-contorno" id="cancelar" hidden>Cancelar edição</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/categorias.js"></script>
</body>
</html>
