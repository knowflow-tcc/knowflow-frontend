<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buscar conhecimento | KnowFlow</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <script src="/js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="carregando">
<div class="app">
    <aside class="sidebar" id="kf-sidebar"></aside>
    <div class="app-main">
        <header class="topbar" id="kf-topbar"></header>

        <!-- Tela inicial: busca de conhecimento (RF08, RF19) -->
        <main class="conteudo">
            <div class="cabecalho-pagina">
                <div>
                    <h2>Buscar conhecimento</h2>
                    <p class="subtitulo">Antes de começar um atendimento, veja se o problema já foi resolvido por alguém.</p>
                </div>
                <a class="botao botao-primario" href="/problema-form.html" data-perfis="COLABORADOR,GESTOR">
                    <i class="bi bi-plus-lg"></i> Registrar problema
                </a>
            </div>

            <form id="form-busca" class="painel" role="search">
                <div class="painel-corpo">
                    <div class="busca-grande mb-3">
                        <i class="bi bi-search"></i>
                        <input class="form-control form-control-lg" name="texto" type="search" data-busca-principal
                               placeholder="Descreva o problema. Ex.: impressora não imprime" aria-label="O que você procura?">
                        <button type="submit" class="botao botao-primario">Buscar</button>
                    </div>
                    <div class="row g-2">
                        <div class="col-12 col-md-6 col-xl-3">
                            <label class="form-label" for="categoriaId">Categoria <span class="opcional">(inclui subcategorias)</span></label>
                            <select class="form-select" id="categoriaId" name="categoriaId"></select>
                        </div>
                        <div class="col-12 col-md-6 col-xl-2">
                            <label class="form-label" for="departamentoId">Departamento</label>
                            <select class="form-select" id="departamentoId" name="departamentoId"></select>
                        </div>
                        <div class="col-6 col-md-4 col-xl-2">
                            <label class="form-label" for="status">Situação</label>
                            <select class="form-select" id="status" name="status">
                                <option value="">Todas</option>
                                <option value="ABERTO">Aberto</option>
                                <option value="RESOLVIDO">Resolvido</option>
                            </select>
                        </div>
                        <div class="col-6 col-md-4 col-xl-2">
                            <label class="form-label" for="de">Registrado de</label>
                            <input class="form-control" type="date" id="de" name="de">
                        </div>
                        <div class="col-6 col-md-4 col-xl-2">
                            <label class="form-label" for="ate">até</label>
                            <input class="form-control" type="date" id="ate" name="ate">
                        </div>
                        <div class="col-6 col-md-4 col-xl-1">
                            <label class="form-label" for="ordem">Ordenar</label>
                            <select class="form-select" id="ordem" name="ordem">
                                <option value="">Automático</option>
                                <option value="relevancia">Relevância</option>
                                <option value="recentes">Mais recentes</option>
                                <option value="antigos">Mais antigos</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-3 d-flex flex-wrap align-items-center gap-3">
                        <div class="form-check form-switch m-0">
                            <input class="form-check-input" type="checkbox" role="switch" id="somenteFavoritos" name="somenteFavoritos" value="true">
                            <label class="form-check-label" for="somenteFavoritos"><i class="bi bi-star-fill text-warning"></i> Somente meus favoritos</label>
                        </div>
                        <button type="button" class="botao botao-contorno botao-pequeno" id="limpar">
                            <i class="bi bi-x-circle"></i> Limpar filtros
                        </button>
                    </div>
                </div>
            </form>

            <p class="subtitulo mb-3" id="resumo" aria-live="polite"></p>
            <div id="resultados" class="resultados"></div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/busca.js"></script>
</body>
</html>
