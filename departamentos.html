<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Departamentos | KnowFlow</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <script src="/js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="carregando">
<div class="app">
    <aside class="sidebar" id="kf-sidebar"></aside>
    <div class="app-main">
        <header class="topbar" id="kf-topbar"></header>

        <!-- RF03 - cadastro de departamentos (Administrador) -->
        <main class="conteudo">
            <div class="cabecalho-pagina">
                <div>
                    <h2>Departamentos</h2>
                    <p class="subtitulo">Setores da empresa. Cada usuário e cada problema pertence a um departamento.</p>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-12 col-lg-7">
                    <section class="painel">
                        <div class="painel-cabecalho"><h3><i class="bi bi-building"></i> Departamentos cadastrados</h3><span class="contador" id="total">0</span></div>
                        <div class="tabela-rolavel">
                            <table class="tabela">
                                <thead><tr><th>Nome</th><th>Usuários</th><th class="acoes">Ações</th></tr></thead>
                                <tbody id="linhas"></tbody>
                            </table>
                        </div>
                    </section>
                </div>
                <div class="col-12 col-lg-5">
                    <form class="painel painel-fixo" id="form-departamento" novalidate>
                        <div class="painel-cabecalho"><h3 id="titulo-form"><i class="bi bi-plus-circle"></i> Novo departamento</h3></div>
                        <div class="painel-corpo">
                            <div data-erro-geral></div>
                            <div class="mb-3">
                                <label class="form-label" for="nome">Nome *</label>
                                <input class="form-control" id="nome" name="nome" maxlength="100" required placeholder="Ex.: Suporte de TI">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="descricao">Descrição <span class="opcional">(opcional)</span></label>
                                <textarea class="form-control" id="descricao" name="descricao" rows="3" maxlength="500"></textarea>
                            </div>
                            <div class="formulario-acoes">
                                <button type="submit" class="botao botao-primario"><i class="bi bi-check-lg"></i> Salvar</button>
                                <button type="button" class="botao botao-contorno" id="cancelar" hidden>Cancelar edição</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/departamentos.js"></script>
</body>
</html>
