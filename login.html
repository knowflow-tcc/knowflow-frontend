<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | KnowFlow</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <script src="/js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<!-- RF01 - autenticação por e-mail e senha -->
<main class="auth">
    <button type="button" class="btn-tema" data-alternar-tema title="Alternar tema claro/escuro">
        <i class="bi bi-moon-stars-fill" data-icone-tema></i><span data-rotulo-tema>Escuro</span>
    </button>

    <div class="auth-caixa">
        <div class="auth-marca">
            <i class="bi bi-diagram-3-fill"></i>
            <span>Know<span class="marca-sufixo">Flow</span></span>
        </div>

        <div class="painel">
            <div class="painel-corpo p-4">
                <h2 class="h5 fw-bold mb-1">Entrar</h2>
                <p class="subtitulo mb-4">Fluxo do Conhecimento: registre, encontre e reaproveite soluções.</p>

                <div id="aviso"></div>

                <form id="form-login" novalidate>
                    <div data-erro-geral></div>
                    <div class="mb-3">
                        <label class="form-label" for="email">E-mail</label>
                        <input class="form-control" id="email" name="email" type="email" autocomplete="username"
                               placeholder="nome@empresa.com" required autofocus>
                    </div>
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-baseline">
                            <label class="form-label" for="senha">Senha</label>
                            <a class="link-pequeno" href="/recuperar-senha.html">Esqueci minha senha</a>
                        </div>
                        <input class="form-control" id="senha" name="senha" type="password" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="botao botao-primario botao-bloco">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </button>
                </form>
            </div>
        </div>
        <p class="text-center subtitulo mt-3">Não tem acesso? Peça ao administrador do sistema.</p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
