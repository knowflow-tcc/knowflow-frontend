<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Problema | KnowFlow</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <script src="/js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="carregando">
<div class="app">
    <aside class="sidebar" id="kf-sidebar"></aside>
    <div class="app-main">
        <header class="topbar" id="kf-topbar"></header>

        <!-- RF20 - detalhes do problema -->
        <main class="conteudo">
            <a class="voltar" href="/index.html"><i class="bi bi-arrow-left"></i> Voltar para a busca</a>

            <div id="aviso-arquivado"></div>

            <div class="cabecalho-pagina">
                <div class="min-w-0">
                    <nav class="caminho-categoria" id="caminho" aria-label="Categoria"></nav>
                    <h2 id="titulo">Carregando...</h2>
                    <div class="meta mt-2" id="meta"></div>
                    <div class="termos" id="palavras"></div>
                </div>
                <div class="d-flex flex-wrap gap-2" id="acoes"></div>
            </div>

            <div class="row g-4">
                <div class="col-12 col-xl-8">
                    <section class="painel">
                        <div class="painel-cabecalho"><h3><i class="bi bi-card-text"></i> Descrição</h3></div>
                        <div class="painel-corpo texto-livre" id="descricao"></div>
                    </section>

                    <!-- RF16 - anexos do problema -->
                    <section class="painel" aria-labelledby="titulo-anexos">
                        <div class="painel-cabecalho">
                            <h3 id="titulo-anexos"><i class="bi bi-paperclip"></i> Anexos</h3>
                            <span class="contador" id="total-anexos">0</span>
                        </div>
                        <div class="painel-corpo" id="anexos"></div>
                    </section>

                    <section class="painel" aria-labelledby="titulo-causas">
                        <div class="painel-cabecalho">
                            <h3 id="titulo-causas"><i class="bi bi-search-heart"></i> Causas</h3>
                            <span class="contador" id="total-causas">0</span>
                        </div>
                        <ul class="lista-itens" id="causas"></ul>
                        <form class="form-novo-item" id="form-causa" hidden novalidate>
                            <label class="form-label" for="nova-causa">Adicionar causa</label>
                            <textarea class="form-control" id="nova-causa" name="descricao" rows="2" maxlength="5000"
                                      placeholder="Por que o problema aconteceu?"></textarea>
                            <button type="submit" class="botao botao-primario botao-pequeno mt-2"><i class="bi bi-plus-lg"></i> Adicionar causa</button>
                        </form>
                    </section>

                    <section class="painel" aria-labelledby="titulo-solucoes">
                        <div class="painel-cabecalho">
                            <h3 id="titulo-solucoes"><i class="bi bi-lightbulb"></i> Soluções</h3>
                            <span class="dica">As validadas pelo gestor aparecem primeiro.</span>
                        </div>
                        <ul class="lista-itens" id="solucoes"></ul>
                        <form class="form-novo-item" id="form-solucao" hidden novalidate>
                            <label class="form-label" for="nova-solucao">Adicionar solução</label>
                            <textarea class="form-control" id="nova-solucao" name="descricao" rows="3" maxlength="5000"
                                      placeholder="O que foi feito (ou pode ser feito) para resolver? Descreva o passo a passo."></textarea>
                            <button type="submit" class="botao botao-primario botao-pequeno mt-2"><i class="bi bi-plus-lg"></i> Adicionar solução</button>
                        </form>
                    </section>
                </div>

                <div class="col-12 col-xl-4">
                    <section class="painel" aria-labelledby="titulo-semelhantes">
                        <div class="painel-cabecalho">
                            <h3 id="titulo-semelhantes"><i class="bi bi-intersect"></i> Problemas semelhantes</h3>
                            <span class="contador" id="total-semelhantes">0</span>
                        </div>
                        <div id="semelhantes"></div>
                    </section>

                    <section class="painel" aria-labelledby="titulo-historico">
                        <div class="painel-cabecalho"><h3 id="titulo-historico"><i class="bi bi-clock-history"></i> Histórico</h3></div>
                        <ol class="linha-tempo" id="historico"></ol>
                    </section>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/semelhantes.js"></script>
<script src="/js/problema.js"></script>
</body>
</html>
