<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Histórico de ações | KnowFlow</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <script src="/js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="carregando">
<div class="app">
    <aside class="sidebar" id="kf-sidebar"></aside>
    <div class="app-main">
        <header class="topbar" id="kf-topbar"></header>

        <!-- RF11 / RN10 - histórico geral de ações (Administrador) -->
        <main class="conteudo">
            <div class="cabecalho-pagina">
                <div>
                    <h2>Histórico de ações</h2>
                    <p class="subtitulo">Toda inclusão, alteração, validação e arquivamento fica registrada, com usuário e data (últimas 300 ações).</p>
                </div>
                <div>
                    <label class="form-label" for="tabela">Tipo de registro</label>
                    <select class="form-select" id="tabela">
                        <option value="">Todos</option>
                        <option value="problema">Problemas</option>
                        <option value="causa">Causas</option>
                        <option value="solucao">Soluções</option>
                        <option value="categoria">Categorias</option>
                        <option value="usuario">Usuários</option>
                        <option value="departamento">Departamentos</option>
                    </select>
                </div>
            </div>

            <section class="painel">
                <div class="tabela-rolavel">
                    <table class="tabela">
                        <thead><tr><th>Data e hora</th><th>Usuário</th><th>Ação</th><th>Registro</th></tr></thead>
                        <tbody id="linhas"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/historico.js"></script>
</body>
</html>
