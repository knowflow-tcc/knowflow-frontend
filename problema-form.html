<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar problema | KnowFlow</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <script src="/js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="carregando">
<div class="app">
    <aside class="sidebar" id="kf-sidebar"></aside>
    <div class="app-main">
        <header class="topbar" id="kf-topbar"></header>

        <!-- RF04 registrar / RF15 editar problema, RF07 categoria e palavras-chave, RF09 semelhantes -->
        <main class="conteudo">
            <a class="voltar" href="/index.html" id="voltar"><i class="bi bi-arrow-left"></i> Voltar</a>
            <div class="cabecalho-pagina">
                <div>
                    <h2 id="titulo-pagina">Registrar problema</h2>
                    <p class="subtitulo">Descreva o que aconteceu. Enquanto você digita, mostramos problemas parecidos que já foram registrados.</p>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-12 col-lg-7">
                    <form id="form-problema" class="painel" novalidate>
                        <div class="painel-corpo">
                            <div data-erro-geral></div>
                            <div class="mb-3">
                                <label class="form-label" for="titulo">Título *</label>
                                <input class="form-control" id="titulo" name="titulo" maxlength="150" required
                                       placeholder="Ex.: Impressora do financeiro não imprime">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="descricao">Descrição *</label>
                                <textarea class="form-control" id="descricao" name="descricao" rows="6" maxlength="5000" required
                                          placeholder="O que acontece, desde quando, mensagens de erro, quem é afetado..."></textarea>
                            </div>
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="departamentoId">Departamento *</label>
                                    <select class="form-select" id="departamentoId" name="departamentoId" required></select>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="categoriaId">Categoria *</label>
                                    <select class="form-select" id="categoriaId" name="categoriaId" required></select>
                                </div>
                            </div>
                            <div class="mt-3">
                                <label class="form-label" for="palavrasChave">Palavras-chave <span class="opcional">(opcional, separadas por vírgula)</span></label>
                                <input class="form-control" id="palavrasChave" name="palavrasChave" placeholder="Ex.: impressora, spooler, financeiro">
                                <div class="termos" id="previa-palavras"></div>
                                <div class="form-text">Ajudam a encontrar este problema depois. Use no máximo 10.</div>
                            </div>
                            <div class="formulario-acoes">
                                <button type="submit" class="botao botao-primario"><i class="bi bi-check-lg"></i> Salvar problema</button>
                                <a class="botao botao-contorno" href="/index.html" id="cancelar">Cancelar</a>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="col-12 col-lg-5">
                    <section class="painel painel-fixo" aria-labelledby="titulo-semelhantes">
                        <div class="painel-cabecalho">
                            <h3 id="titulo-semelhantes"><i class="bi bi-intersect"></i> Problemas semelhantes</h3>
                            <span class="contador" id="total-semelhantes">0</span>
                        </div>
                        <div id="semelhantes" aria-live="polite">
                            <div class="painel-vazio"><i class="bi bi-keyboard"></i>Comece a digitar o título para ver se o problema já existe.</div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/semelhantes.js"></script>
<script src="/js/problema-form.js"></script>
</body>
</html>
